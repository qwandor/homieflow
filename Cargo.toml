[package]
name = "homieflow"
version = "0.1.0"
description = "Google Home to Homie MQTT bridge."
repository = "https://github.com/qwandor/homieflow"
authors = ["Andrew Walbran <qwandor@gmail.com>"]
categories = ["network-programming"]
keywords = ["iot", "home-automation", "smart-home", "web"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
google-smart-home = "0.1.3"
askama = "0.16.0"
tokio = { version = "1.52.3", features = [
    "sync",
    "time",
    "macros",
    "rt-multi-thread",
] }
thiserror = "2.0.18"
serde = "1.0.228"
serde_json = "1.0.150"
async-trait = "0.1.89"
url = { version = "2.5.8", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
axum = { version = "0.6.20", features = ["ws", "headers"] }
google-api-proto = { version = "1.279.0", features = ["google-home-graph-v1"] }
google-authz = { version = "1.0.0-alpha.5", features = ["tonic"] }
hex = "0.4.3"
headers = "0.3.9"
toml = "1.1.3"
tower-http = { version = "0.3.2", features = ["trace"] }
axum-server = { version = "0.5.1", features = ["tls-rustls"] }
homie-controller = "0.9.0"
jsonwebtoken-google = "0.1.6"
jsonwebtoken = "7.2.0"
prost-types = "0.11.9"
rand = "0.10.2"
regex = "1.13.0"
rumqttc = "0.22.0"
rustls = "0.21.1"
rustls-native-certs = "0.6.3"
semver = { version = "1.0.28", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
tonic = { version = "0.8.2", features = ["tls", "tls-roots"] }
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.5", features = ["serde"] }
xdg = "3.0.0"

[dev-dependencies]
tokio = { version = "1.52.3", features = [
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }

[package.metadata.deb]
section = "net"
maintainer-scripts = "debian-scripts"
conf-files = ["/etc/homieflow.toml"]
assets = [
    [
        "target/release/homieflow",
        "usr/bin/",
        "755",
    ],
    [
        "example.toml",
        "etc/homieflow.toml",
        "640",
    ],
    [
        "README.md",
        "usr/share/doc/homieflow/",
        "644",
    ],
]

# This section needs to be here even if it's empty, for the systemd integration to work.
[package.metadata.deb.systemd-units]
